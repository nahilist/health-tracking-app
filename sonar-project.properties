# Project Identification
sonar.projectKey=PulseHealth
sonar.projectName=Pulse Health
sonar.projectVersion=1.0.0

# Encoding & Language
sonar.sourceEncoding=UTF-8

# Source Code & Tests
sonar.sources=app/src/main/java
sonar.tests=app/src/test/java

# Compiled Bytecode for Symbol Resolution and Quality Rules
sonar.java.binaries=app/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes,app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes

# JaCoCo Code Coverage & JUnit Test Results
sonar.junit.reportPaths=app/build/test-results/testDebugUnitTest
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
sonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml

# Code Exclusions
sonar.exclusions=**/schemas/**,**/theme/**,**/*Preview*.*,**/PulseHealthApplication.kt,**/MainActivity.kt
sonar.coverage.exclusions=**/schemas/**,**/theme/**,**/*Preview*.*,**/PulseHealthApplication.kt,**/MainActivity.kt,**/ui/components/**,**/ui/summary/**,**/ui/browse/**,**/ui/detail/**,**/ui/profile/**,**/ui/onboarding/**,**/ui/PulseHealthApp.kt
